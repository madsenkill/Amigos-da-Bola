<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelada de Terça</title>
  <meta name="description" content="Ranking, destaques e estatísticas da Pelada de Terça." />

  <!-- Favicon (bola de futebol dourada) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%2318181B' stroke='%23F59E0B' stroke-width='2'/%3E%3Cpath d='M12 7l2 4 2-4-2-3z' fill='%23F59E0B'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            night: '#0F0F12',
            panel: '#18181B',
            'panel-2': '#1F1F24',
            gold: '#F59E0B',
            'gold-soft': '#FBBF24',
            neon: '#10B981',
            'neon-soft': '#34D399',
            dim: '#A1A1AA',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Estilos do sistema -->
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body class="bg-night text-zinc-200 min-h-screen">
  <div class="bg-glow min-h-screen">
    <!-- ==================== HEADER ==================== -->
    <header class="sticky top-0 z-40 backdrop-blur-xl bg-night/80 border-b border-white/[0.06]">
      <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-3 min-w-0">
          <span class="relative grid place-items-center w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 shadow-lg shadow-amber-500/30 flex-none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241503" stroke-width="1.8">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7.5 14.2 10l.6-3.1L12 5l-2.8 1.9L9.8 10 12 7.5z" fill="#241503" stroke="none" />
              <path d="M4.5 9l4 1.5M19.5 9l-4 1.5M5.2 16.5l3.6-1.8M18.8 16.5l-3.6-1.8M12 21v-4" stroke-linecap="round" />
            </svg>
          </span>
          <span class="min-w-0">
            <span class="block font-display font-extrabold text-white leading-tight truncate" data-nome-pelada>Pelada de Terça</span>
            <span class="block text-[11px] text-zinc-500 truncate" data-subtitulo>Futebol raiz, toda terça às 20h</span>
          </span>
        </a>

        <!-- Seletor de mês -->
        <div class="flex items-center gap-2">
          <label class="sr-only" for="seletor-mes">Mês / Temporada</label>
          <div class="relative">
            <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-amber-400" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <select id="seletor-mes" class="input !w-auto !pl-9 pr-8 font-semibold text-sm cursor-pointer bg-panel-2 border-white/[0.08] rounded-xl"></select>
          </div>
          <a href="/admin.html" title="Painel administrativo" class="btn btn-ghost !p-2.5 rounded-xl" aria-label="Abrir painel administrativo">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </a>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

      <!-- ============ PRÓXIMO JOGO ============ -->
      <section id="proximo-jogo" aria-label="Próximo jogo"></section>

      <!-- ============ DESTAQUES DA RODADA ============ -->
      <section id="destaques" aria-label="Destaques da rodada"></section>

      <!-- ============ RANKING GERAL ============ -->
      <section id="ranking" class="card">
        <div class="flex items-center justify-between gap-3 mb-4">
          <div>
            <h2 class="font-display font-bold text-lg text-white flex items-center gap-2">
              <span class="text-amber-400 inline-grid place-items-center w-7 h-7 rounded-lg bg-amber-400/10">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"/></svg>
              </span>
              Classificação Geral
            </h2>
            <p class="text-xs text-zinc-500 mt-0.5">Pontuação individual · 3 pts por vitória, 1 por empate</p>
          </div>
          <span id="periodo-ranking" class="badge badge-amber"></span>
        </div>
        <div id="corpo-ranking" class="table-wrap"></div>
      </section>

      <!-- ============ ARTILHARIA & CARTÕES ============ -->
      <section id="estatisticas" aria-label="Artilharia e cartões"></section>

    </main>

    <footer class="max-w-6xl mx-auto px-4 pb-10 pt-4 text-center text-xs text-zinc-600 border-t border-white/[0.06] mt-10">
      <p>Pelada de Terça · Futebol raiz desde sempre · <a href="/admin.html" class="text-amber-500/80 hover:text-amber-400 transition-colors">Painel administrativo</a></p>
    </footer>
  </div>

  <!-- Módulo da página pública -->
  <script type="module" src="/src/public.js"></script>
</body>
</html>
